<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的专属漫画阁</title>
  <style>
    :root {
      --bg: #fff8f1;
      --panel: rgba(255, 255, 255, 0.84);
      --text: #2e241b;
      --muted: #8b7663;
      --line: rgba(80, 55, 28, 0.08);
      --accent: #f2a65a;
      --accent-gradient: linear-gradient(135deg, #f2a65a, #ff7b00);
      --shadow: 0 12px 30px rgba(113, 76, 35, 0.10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 214, 170, 0.38), transparent 26%),
        radial-gradient(circle at top right, rgba(242, 166, 90, 0.14), transparent 22%),
        linear-gradient(180deg, #fffaf4 0%, #fff2e6 100%);
    }

    /* 布局：使用 flex 布局，方便侧边栏收起 */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* 侧边栏及收起过渡效果 */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 280px;
      flex-shrink: 0;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: rgba(255, 249, 241, 0.78);
      backdrop-filter: blur(18px);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  padding 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  border-color 0.3s ease;
      overflow: hidden;
      z-index: 100;
    }

    .sidebar-wrapper {
      width: 240px;
    }

    /* 侧边栏收起后的控制状态 */
    .app.sidebar-collapsed .sidebar {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right-color: transparent;
    }

    .brand {
      padding: 10px 8px 20px;
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0.4px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin: 18px 10px 10px;
    }

    .nav-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-btn, .sort-btn {
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    /* 分类按钮悬停 */
    .sub-btn:hover {
      background: var(--accent-gradient);
      color: #fff !important;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(242, 166, 90, 0.35);
    }

    .sub-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 252, 248, 0.82);
      color: var(--muted);
      font-size: 14px;
      border-color: var(--line);
    }

    .sub-btn.active {
      background: #fff;
      color: var(--text);
      border-color: rgba(242, 166, 90, 0.35);
      box-shadow: var(--shadow);
      font-weight: bold;
    }

    .sidebar-footer {
      margin-top: 24px;
      padding: 16px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .main { 
      flex: 1;
      min-width: 0;
      padding: 28px; 
    }

    /* 核心面板结构 */
    .control-panel {
      padding: 20px;
      display: grid;
      gap: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      margin-bottom: 22px;
    }

    /* 自定义介绍文字区域样式 */
    .custom-intro {
      background: linear-gradient(90deg, rgba(242,166,90,0.06), rgba(255,215,173,0.12));
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: 10px;
    }
    .custom-intro p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #73563c;
      font-weight: 500;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      color: var(--text);
      transition: all 0.3s ease;
    }

    .search:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(242, 166, 90, 0.2);
    }

    /* 排序按钮 */
    .sort-btn {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14px;
    }
    .sort-btn:hover {
      background: #fff;
      border-color: var(--accent);
      color: #ff7b00;
      transform: translateY(-1px);
    }
    .sort-btn.active {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(242, 166, 90, 0.2);
    }

    #toggleSidebar {
      background: rgba(80, 55, 28, 0.05);
      border-color: transparent;
      font-weight: bold;
    }
    #toggleSidebar:hover {
      background: rgba(80, 55, 28, 0.12);
      color: var(--text);
    }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin: 26px 0 14px;
    }
    .content-head h3 { margin: 0; font-size: 22px; }
    .content-head span { color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* 漫画卡片基础架构 */
    .card {
      overflow: hidden;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      display: flex; 
      align-items: flex-start; /* 确保封面和右侧内容整体绝对居顶对齐 */
      transition: all 0.25s ease;
    }

    /* 删除了之前的全卡片摇晃，改回顺滑的整体上浮提升与动态发光 */
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 16px 35px rgba(242, 166, 90, 0.22);
    }

    /* 漫画专属：固定 2:3 纵向海报比例 */
    .cover {
      width: 120px;
      aspect-ratio: 2 / 3;
      margin: 16px;
      border: 1px solid rgba(242, 166, 90, 0.34);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 214, 170, 0.20), rgba(255, 241, 227, 0.10));
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 右侧信息容器：内容绝对靠顶部排列 */
    .card-body {
      padding: 18px 20px 18px 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; 
      align-items: flex-start;
      gap: 10px;
    }

    .title {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      color: var(--text);
      transition: color 0.2s ease;
    }
    .card:hover .title {
      color: #ff7b00;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(242,166,90,0.12);
      color: #b86a20;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .card:hover .tag {
      background: rgba(242,166,90,0.22);
      color: #ff6a00;
    }

    .rating {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #b86a20;
      font-weight: 700;
      white-space: nowrap;
    }
    .stars {
      letter-spacing: 1px;
      color: #f2a65a;
      font-size: 14px;
      font-weight: 700;
    }

    /* ---------------- 【核心新增：文字抖动与彩虹变色】 ---------------- */
    /* 彩虹变色动画 */
    @keyframes rainbow {
      0% { color: #ff7979; }
      25% { color: #badc58; }
      50% { color: #7ed6df; }
      75% { color: #e056fd; }
      100% { color: #ff7979; }
    }

    /* 高频轻微文字抖动动画 */
    @keyframes textShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-0.6px, 0.4px); }
      40% { transform: translate(-0.4px, -0.6px); }
      60% { transform: translate(0.6px, 0.4px); }
      80% { transform: translate(-0.4px, 0.6px); }
      100% { transform: translate(0, 0); }
    }

    /* 作品点评（简介）文字样式：炫酷的彩虹色变换与高频微抖动无缝叠加 */
    .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      display: block; /* 转换为块级以完美承载变型效果 */
      font-weight: bold;
      animation: rainbow 3s linear infinite, textShake 0.15s linear infinite;
    }
    /* ------------------------------------------------------------- */

    .footer-note { margin: 20px 0 8px; color: var(--muted); font-size: 13px; }
    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.72);
      border: 1px dashed rgba(242, 166, 90, 0.30);
      border-radius: 22px;
    }

    /* 响应式设计 */
    @media (max-width: 1100px) {
      .app { flex-direction: column; }
      .sidebar { 
        position: relative; height: auto; width: 100%; border-right: none; border-bottom: 1px solid var(--line); 
        transition: height 0.3s ease, padding 0.3s ease;
      }
      .sidebar-wrapper { width: 100%; }
      .app.sidebar-collapsed .sidebar { 
        width: 100%; height: 0; padding-top: 0; padding-bottom: 0; border-bottom-color: transparent; 
      }
    }

    @media (max-width: 720px) {
      .main { padding: 18px; }
      .sidebar { padding: 18px 14px; }
      .card { flex-direction: column; align-items: stretch; }
      .cover { width: calc(100% - 32px); margin: 16px 16px 0 16px; }
      .card-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-wrapper">
        <div class="brand">
          <h1>漫画收藏阁</h1>
          <p>专注、纯粹的漫画次元记录空间。完美支持 2:3 漫画纵向比例封面展现。</p>
        </div>

        <div class="section-title">漫画分类</div>
        <div id="subCategoryNav" class="nav-group"></div>

        <div class="sidebar-footer">
          静态漫画展示站。<br />
          点评文字已注入魔性高频微晃动及彩虹色彩流转特效！
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="panel control-panel">
        
        <div class="custom-intro">
          <p>✨ 欢迎来到我的私人漫画收纳所！这里珍藏着所有触动过灵魂的热血分镜与日常温存。可在 index.html 中随时自定义此段文字。 ✨</p>
        </div>

        <div class="control-row">
          <button id="toggleSidebar" class="sort-btn">📂 收起侧边栏</button>
          <input id="searchInput" class="search" type="text" placeholder="搜索漫画名称、标签或简介..." />
        </div>
        <div class="control-row">
          <button class="sort-btn active" data-sort="rating-desc">评分从高到低</button>
          <button class="sort-btn" data-sort="rating-asc">评分从低到高</button>
          <button class="sort-btn" data-sort="title-asc">名称 A-Z</button>
        </div>
      </section>

      <div class="content-head">
        <div>
          <h3 id="listTitle">全部漫画</h3>
          <span id="listMeta">按评分排序</span>
        </div>
        <div><span id="resultCount">0</span> 项结果</div>
      </div>

      <section id="cardGrid" class="grid"></section>
      <div id="emptyState" class="empty" style="display:none;">没有找到符合过滤条件的漫画。</div>

      <div class="footer-note">建议部署到 GitHub Pages 时保留为单页入口：<code>index.html</code>。封面图可直接放本地路径，例如 <code>images/xxx.jpg</code>。</div>
    </main>
  </div>

  <script>
    // 聚焦纯漫画的数源
    const data = [
      { title: "电锯人", sub: "热血", rating: 4, cover: "", desc: "节奏怪异且极猛，分镜具有强烈的电影质感与疯狂张力。" },
      { title: "海贼王", sub: "冒险", rating: 5, cover: "", desc: "连载数十载的史诗巨作，拥有极其庞大的世界观和令人动容的伏笔。" },
      { title: "灌篮高手", sub: "运动", rating: 5, cover: "", desc: "属于青春与汗水的绝对经典，全国大赛阶段的无声分镜堪称漫画史巅峰。" },
      { title: "间谍过家家", sub: "喜剧", rating: 4, cover: "", desc: "顶尖特工、杀手组织与读心术超能力女儿构成的爆笑伪装家庭日常。" },
      { title: "古见同学有交流障碍症", sub: "日常", rating: 4, cover: "", desc: "极致细腻的校园社交温情剧，画风极具特色，日常观感轻松舒适。" },
      { title: "进击的巨人", sub: "奇幻", rating: 5, cover: "", desc: "故事结构精妙严密，在绝望与自由的冲突中铺展开宏大的漫画画卷。" }
    ];

    const state = {
      sub: "全部",
      sort: "rating-desc",
      search: ""
    };

    const subs = ["全部", ...new Set(data.map(i => i.sub))];

    const subCategoryNav = document.getElementById("subCategoryNav");
    const cardGrid = document.getElementById("cardGrid");
    const emptyState = document.getElementById("emptyState");
    const listTitle = document.getElementById("listTitle");
    const listMeta = document.getElementById("listMeta");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const toggleSidebarBtn = document.getElementById("toggleSidebar");
    const appContainer = document.querySelector(".app");

    function starText(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function renderSubNav() {
      subCategoryNav.innerHTML = subs.map(sub => `
        <button class="sub-btn ${state.sub === sub ? 'active' : ''}" data-sub="${sub}">${sub}</button>
      `).join("");
    }

    function applyFilters() {
      let list = [...data];
      if (state.sub !== "全部") list = list.filter(i => i.sub === state.sub);

      const q = state.search.trim().toLowerCase();
      if (q) {
        list = list.filter(i => [i.title, i.sub, i.desc].join(" ").toLowerCase().includes(q));
      }

      if (state.sort === "rating-desc") list.sort((a, b) => b.rating - a.rating);
      if (state.sort === "rating-asc") list.sort((a, b) => a.rating - b.rating);
      if (state.sort === "title-asc") list.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hans-CN'));

      return list;
    }

    function updateHeader(count) {
      resultCount.textContent = count;
      listTitle.textContent = state.sub === "全部" ? "全部漫画" : `${state.sub} 漫画`;
      listMeta.textContent = state.search ? `关键词：${state.search}` : `按 ${document.querySelector('.sort-btn.active')?.textContent || '评分从高到低'} 排序`;
    }

    function renderCards() {
      const list = applyFilters();
      updateHeader(list.length);
      cardGrid.innerHTML = list.map(item => `
        <article class="card">
          <div class="cover">
            ${item.cover ? `<img src="${item.cover}" alt="${item.title} 封面">` : `<div class="cover-placeholder">2:3 漫画</div>`}
          </div>
          <div class="card-body">
            <h4 class="title">${item.title}</h4>
            <div class="meta-row">
              <span class="tag">${item.sub}</span>
              <span class="rating"><span class="stars">${starText(item.rating)}</span></span>
            </div>
            <p class="desc">${item.desc}</p>
          </div>
        </article>
      `).join("");

      emptyState.style.display = list.length ? "none" : "block";
    }

    // 侧边栏折叠/展开动画控制
    toggleSidebarBtn.addEventListener("click", () => {
      appContainer.classList.toggle("sidebar-collapsed");
      const isCollapsed = appContainer.classList.contains("sidebar-collapsed");
      toggleSidebarBtn.innerHTML = isCollapsed ? "📂 展开侧边栏" : "📂 收起侧边栏";
    });

    subCategoryNav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-sub]");
      if (!btn) return;
      state.sub = btn.dataset.sub;
      renderSubNav();
      renderCards();
    });

    document.querySelectorAll(".sort-btn[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn[data-sort]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.sort = btn.dataset.sort;
        renderCards();
      });
    });

    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      renderCards();
    });

    // 初始化
    renderSubNav();
    renderCards();
  </script>
</body>
</html>
