<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫画印象阁</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f2eb;          
      --panel: #ffffff;       
      --text: #1a1613;        
      --muted: #4a403a;       
      --line: rgba(90, 80, 75, 0.18); 
      --accent: #d96a43;      
      --shadow: 0 8px 24px rgba(40, 30, 20, 0.05);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      /* 🌟 【修改】将全局字体设置为思源黑体，并做好各平台的本地思源黑体回退配置 */
      font-family: "Noto Sans SC", "Source Han Sans SC", "Source Han Sans CN", sans-serif;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(rgba(40, 30, 20, 0.05) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 280px;
      flex-shrink: 0;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: #ffffff;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  padding 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      z-index: 1000;
    }

    .sidebar-wrapper {
      width: 240px;
    }

    .sidebar-close-btn {
      position: absolute;
      top: 24px;
      right: 20px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 8px;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 1010;
    }
    .sidebar-close-btn:hover {
      background: #faf9f6;
      color: var(--text);
      border-color: var(--muted);
    }

    .app.sidebar-collapsed .sidebar {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right-color: transparent;
    }

    .brand {
      padding: 10px 30px 20px 8px; 
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.4px;
      color: var(--text);
      font-weight: 800; /* 加重标题 */
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px; 
      line-height: 1.7;
      font-weight: 500;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text); 
      font-weight: 700;
      margin: 18px 10px 10px;
    }

    .nav-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-btn, .sort-btn {
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .sub-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      background: #faf9f6;
      color: var(--muted);
      font-size: 14px;
      border: 1px solid var(--line);
      font-weight: 500;
    }

    .sub-btn:hover {
      background: #f0ede6;
      color: var(--text);
    }

    .sub-btn.active {
      background: var(--accent);
      color: #ffffff !important;
      border-color: transparent;
      font-weight: 700;
    }

    .main { 
      flex: 1;
      min-width: 0;
      padding: 28px; 
    }

    .control-panel {
      padding: 20px;
      display: grid;
      gap: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .custom-intro {
      background: #fff2ee; 
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      border-radius: 8px;
    }
    .custom-intro p {
      margin: 0;
      font-size: 15px; 
      line-height: 1.6;
      color: #7a321c; 
      font-weight: 800; 
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search {
      flex: 1;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      color: var(--text);
      transition: all 0.2s ease;
      font-family: inherit; /* 确保输入框也使用思源黑体 */
    }

    .search:focus { 
      border-color: var(--accent); 
    }

    .sort-btn {
      padding: 10px 16px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }
    .sort-btn:hover {
      background: #faf9f6;
      border-color: var(--muted);
    }
    .sort-btn.active {
      background: var(--text);
      color: #ffffff;
      border-color: transparent;
      font-weight: 700;
    }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin: 26px 0 20px;
    }
    .content-head h3 { margin: 0; font-size: 22px; color: var(--text); font-weight: 800; }
    .content-head span { color: var(--muted); font-size: 14px; font-weight: 500; }

    .grid {
      display: block;         
      column-count: 1;        
      column-gap: 28px;       
      padding-top: 15px;
    }
    
    @media (min-width: 992px) {
      .grid {
        column-count: 2;      
      }
    }

    .card {
      position: relative;
      text-decoration: none;
      overflow: visible;      
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex; 
      align-items: flex-start; 
      
      transform: none;
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      
      transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), 
                  box-shadow 0.25s ease, 
                  border-color 0.25s ease;
      cursor: pointer;
      padding-right: 16px;
      
      margin-top: 20px;       
      margin-bottom: 40px;    
      break-inside: avoid;    
    }

    .card::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 55px;
      height: 16px;
      background: rgba(217, 106, 67, 0.25); 
      transform: translateX(-50%) rotate(2deg); 
      backdrop-filter: blur(1px);
      pointer-events: none;
      z-index: 2;
    }
    .card:nth-child(odd)::before {
      background: rgba(242, 166, 90, 0.3);
      transform: translateX(-50%) rotate(-2deg);
    }

    .card-index {
      position: absolute;
      right: 16px;
      bottom: -4px;
      font-size: 76px;
      font-weight: 900;
      color: rgba(40, 30, 20, 0.04); 
      font-family: "Impact", Arial, sans-serif;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    .explosion-badge {
      position: absolute;
      top: -35px;        
      right: -25px;       
      width: 100px;       
      height: 100px;      
      z-index: 15;
      filter: drop-shadow(3px 3px 0px #000000);
      transform: rotate(14deg);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .explosion-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--accent);
      box-shadow: 0 16px 32px rgba(40, 30, 20, 0.08);
      z-index: 10;
    }

    .card:hover .explosion-badge {
      transform: rotate(-10deg) scale(1.15);
    }

    .cover {
      width: 130px;            
      aspect-ratio: 2 / 3;
      margin: -22px 16px 16px -12px; 
      border: 3px solid #ffffff;     
      border-radius: 12px;
      background: #faf9f6;
      box-shadow: 0 10px 25px rgba(40, 30, 20, 0.12); 
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 3;
    }
    
    .card:hover .cover { transform: scale(1.04) rotate(-1.5deg); }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-body {
      padding: 16px 4px 16px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; 
      align-items: flex-start;
      gap: 8px;
      z-index: 2;
    }

    .title {
      margin: 0;
      font-size: 19px;
      font-weight: 800; /* 配合思源黑体极粗体使用，显得非常有张力 */
      line-height: 1.35;
      color: var(--text);
    }
    .card:hover .title { color: var(--accent); }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px; 
      align-items: center;
      width: 100%;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 6px;
      background: #f1ede4;       
      border: 1px solid var(--line);
      color: #6b5f55;            
      font-size: 12px;
      font-weight: 600; /* 标签使用半粗体，清晰不扎眼 */         
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-weight: 700;
      margin-left: 4px;
    }
    .stars { color: var(--accent); font-size: 14px; }

    .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      display: block;
      color: var(--muted);       
      white-space: pre-wrap; 
      font-weight: 500; /* 思源黑体的 500 字重非常适合正文阅读，清晰度极高 */         
    }

    @keyframes rainbow {
      0% { color: #ff7979; }
      25% { color: #badc58; }
      50% { color: #7ed6df; }
      75% { color: #e056fd; }
      100% { color: #ff7979; }
    }

    @keyframes textShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-0.6px, 0.4px); }
      40% { transform: translate(-0.4px, -0.6px); }
      60% { transform: translate(0.6px, 0.4px); }
      80% { transform: translate(-0.4px, 0.6px); }
      100% { transform: translate(0, 0); }
    }

    /* ----------- 通用局部特效外挂包 ----------- */
    .rainbow-shake {
      display: inline-block;   
      font-weight: bold;
      animation: rainbow 3s linear infinite, textShake 0.15s linear infinite;
    }

    .rainbow-only {
      display: inline-block;
      font-weight: bold;
      animation: rainbow 3s linear infinite;
    }

    .shake-only {
      display: inline-block;
      color: #ff4757;          
      animation: textShake 0.15s linear infinite;
    }

    .bold-black {
      font-weight: 900;       
      color: #000000;         
    }

    /* 加粗放大 */
    .bold-black-pop {
      font-weight: 900;       
      color: #000000;         
      font-size: 1.25em;      
      line-height: 1.1;         
    }

    .bold-black-shake {
      display: inline-block;  
      font-weight: 900; /* 疯狂抖动文字使用最高级 900 黑色体 */      
      font-size: 1.25em; 
      color: #000000;         
      animation: textShake 0.15s linear infinite; 
    }

    .footer-note { margin: 20px 0 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
      background: #ffffff;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .sidebar { 
        position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; width: 280px; 
        border-right: 1px solid var(--line);
        box-shadow: 4px 0 30px rgba(0,0,0,0.1);
        transform: translateX(0); 
      }
      .app.sidebar-collapsed .sidebar { width: 280px; transform: translateX(-100%); }
      .main { padding: 16px; }

      .grid { column-count: 1; gap: 20px; }
      .card { margin-top: 10px; margin-bottom: 25px; }
      .cover { width: 110px; margin: -16px 12px 12px -6px; border-width: 2px; }
      .title { font-size: 16px; }
      .desc { font-size: 13px; }
      .card-index { font-size: 56px; bottom: -4px; }
      .explosion-badge { width: 70px; height: 70px; top: -16px; right: -10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button id="sidebarCloseBtn" class="sidebar-close-btn" title="收起侧边栏">✕</button>
      
      <div class="sidebar-wrapper">
        <div class="brand">
          <h1>漫画印象阁</h1>
          <p>仅作个人纪录用，不含客观意见。</p>
        </div>

        <div class="section-title">分类标签</div>
        <div id="subCategoryNav" class="nav-group"></div>
      </div>
    </aside>

    <main class="main">
      <section class="panel control-panel">
        <div class="custom-intro">
          <p>既然来了总之就是听我的电波吧！</p>
        </div>

        <div class="control-row">
          <button id="toggleSidebar" class="sort-btn">📂 收起侧边栏</button>
          <input id="searchInput" class="search" type="text" placeholder="这个是搜索栏，我也不知道它为什么要存在、可以搜什么……" />
        </div>
        <div class="control-row">
          <button class="sort-btn active" data-sort="rating-desc">评分从高到低</button>
          <button class="sort-btn" data-sort="rating-asc">评分从低到高</button>
          <button class="sort-btn" data-sort="title-asc">名称 A-Z</button>
        </div>
      </section>

      <div class="content-head">
        <div>
          <h3 id="listTitle">全部漫画</h3>
          <span id="listMeta">按评分排序</span>
        </div>
        <div><span id="resultCount">0</span> 项结果</div>
      </div>

      <section id="cardGrid" class="grid"></section>
      <div id="emptyState" class="empty" style="display:none;">没有找到符合过滤条件的漫画。</div>

      <div class="footer-note">页面底端是不是得写点什么，那就说所有图片来源于网络，侵权删。</div>
    </main>
  </div>

  <script>
    const data = [
      { 
        title: "不觉得村庄建造游戏的NPC也是活生生的人吗", 
        subs: ["神人作品","电波系"], 
        rating: 5, 
        cover: "./images/电锯人.png", 
        desc: "第一部足够自由\n第二部有朝就值回票价了，电次什么的无所谓了\n其实也是很喜欢的作品，但追更完第二部好像也没了念头", 
        effect: "",
        commentImg: "", //"./images/crazy.png", 
        url: "" 
      },
    ];

    const state = {
      sub: "全部",
      sort: "rating-desc",
      search: ""
    };

    const allUniqueSubs = ["全部", ...new Set(data.flatMap(item => item.subs || []))];

    const subCategoryNav = document.getElementById("subCategoryNav");
    const cardGrid = document.getElementById("cardGrid");
    const emptyState = document.getElementById("emptyState");
    const listTitle = document.getElementById("listTitle");
    const listMeta = document.getElementById("listMeta");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const toggleSidebarBtn = document.getElementById("toggleSidebar");
    const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");
    const appContainer = document.querySelector(".app");

    function starText(rating) {
      if(rating < 0){
        return "-" + "☆".repeat(0-rating);
      }
      else if(rating == 114514){
        return "懒得评";
      }
      else if(rating == 67){
        return "太神了评不了";
      }
      else if(rating == 69){
        return "NSFW";
      }
      else if(rating == 2233){
        return "笑了十天忘记评了";
      }
      else if(rating == 555){
        return "眼睛进沙子了看不清不评了";
      }
      else if(rating == 99){
        return "他们在一起之前我拒绝评分";
      }
      else if(rating == 9999){
        return "狗吃巧克力死了评不了了";
      }
      else if(rating == 88){
        return "再见了所有的评分系统";
      }
      else if(rating == 122317){
        return "少话，电波共鸣中";
      }
      else if(rating == 777){
        return "活着就是为了看这本";
      }
      else if(rating == 6246){
        return "111评分就能找到人一起格斗吗";
      }
      else if(rating == 0){
        return "棍木";
      }
      else if(rating == 19){
        return "那个谁什么时候cos辛美尔了就评";
      }
      else if(rating == 98){
        return "无心评价，正在想念那段宿舍一起看恋爱漫画噢噢噢的时光……";
      }
      else if(rating > 5){
        return "★".repeat(rating);
      }
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function renderSubNav() {
      subCategoryNav.innerHTML = allUniqueSubs.map(sub => `
        <button class="sub-btn ${state.sub === sub ? 'active' : ''}" data-sub="${sub}">${sub}</button>
      `).join("");
    }

    function applyFilters() {
      let list = [...data];
      
      if (state.sub !== "全部") {
        list = list.filter(item => item.subs && item.subs.includes(state.sub));
      }

      const q = state.search.trim().toLowerCase();
      if (q) {
        list = list.filter(item => {
          const tagString = item.subs ? item.subs.join(" ") : "";
          return [item.title, tagString, item.desc].join(" ").toLowerCase().includes(q);
        });
      }

      if (state.sort === "rating-desc") list.sort((a, b) => b.rating - a.rating);
      if (state.sort === "rating-asc") list.sort((a, b) => a.rating - b.rating);
      if (state.sort === "title-asc") list.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hans-CN'));

      return list;
    }

    function updateHeader(count) {
      resultCount.textContent = count;
      listTitle.textContent = state.sub === "全部" ? "全部漫画" : `${state.sub} 标签下`;
      listMeta.textContent = state.search ? `关键词：${state.search}` : `按 ${document.querySelector('.sort-btn.active')?.textContent || '评分从高到低'} 排序`;
    }

    function renderCards() {
      const list = applyFilters();
      updateHeader(list.length);
      
      cardGrid.innerHTML = list.map((item, idx) => `
        <a href="${item.url || '#'}" target="_blank" class="card">
          ${item.commentImg ? `
            <div class="explosion-badge">
              <img src="${item.commentImg}" alt="点评图片贴纸">
            </div>
          ` : ''}
          <div class="card-index">${String(idx + 1).padStart(2, '0')}</div>
          <div class="cover">
            ${item.cover ? `<img src="${item.cover}" alt="${item.title} 封面">` : `<div class="cover-placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#b0a8a0;font-weight:bold;background:#eeeae1;">无封面</div>`}
          </div>
          <div class="card-body">
            <h4 class="title">${item.title}</h4>
            <div class="meta-row">
              ${item.subs ? item.subs.map(t => `<span class="tag">${t}</span>`).join("") : ""}
              <span class="rating"><span class="stars">${starText(item.rating)}</span></span>
            </div>
            <p class="desc">${item.desc}</p>
          </div>
        </a>
      `).join("");

      emptyState.style.display = list.length ? "none" : "block";
    }

    function toggleSidebar() {
      appContainer.classList.toggle("sidebar-collapsed");
      const isCollapsed = appContainer.classList.contains("sidebar-collapsed");
      toggleSidebarBtn.innerHTML = isCollapsed ? "📂 展开侧边栏" : "📂 收起侧边栏";
    }

    toggleSidebarBtn.addEventListener("click", toggleSidebar);
    sidebarCloseBtn.addEventListener("click", toggleSidebar);

    subCategoryNav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-sub]");
      if (!btn) return;
      state.sub = btn.dataset.sub;
      renderSubNav();
      renderCards();
      if (window.innerWidth <= 768) {
        appContainer.classList.add("sidebar-collapsed");
        toggleSidebarBtn.innerHTML = "📂 展开侧边栏";
      }
    });

    document.querySelectorAll(".sort-btn[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn[data-sort]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.sort = btn.dataset.sort;
        renderCards();
      });
    });

    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      renderCards();
    });

    if (window.innerWidth <= 768) {
      appContainer.classList.add("sidebar-collapsed");
      toggleSidebarBtn.innerHTML = "📂 展开侧边栏";
    }

    renderSubNav();
    renderCards();
  </script>
</body>
</html>
