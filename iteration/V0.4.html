<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的专属漫画阁</title>
  <style>
    :root {
      --bg: #f7f5f0;          /* 💡 替换为高级的日系纯色底心 */
      --panel: #ffffff;       /* 💡 彻底抛弃半透明，使用纯白 */
      --text: #241e1a;
      --muted: #786c64;
      --line: #e6e2db;        /* 💡 干净平整的纯色边框线 */
      --accent: #d96a43;      /* 💡 优雅平整的砖橙色，拒绝渐变 */
      --shadow: 0 6px 20px rgba(40, 30, 20, 0.05);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg); /* 💡 纯色背景 */
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* 侧边栏：PC端纯色固定 */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 280px;
      flex-shrink: 0;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: #ffffff; /* 💡 纯白背景，无模糊 */
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  padding 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      z-index: 1000;
    }

    .sidebar-wrapper {
      width: 240px;
    }

    /* PC端收起状态 */
    .app.sidebar-collapsed .sidebar {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right-color: transparent;
    }

    .brand {
      padding: 10px 8px 20px;
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.4px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin: 18px 10px 10px;
    }

    .nav-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sub-btn, .sort-btn {
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    /* 纯色扁平化按钮激活与悬停 */
    .sub-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      background: #faf9f6;
      color: var(--muted);
      font-size: 14px;
      border: 1px solid var(--line);
    }

    .sub-btn:hover {
      background: #f0ede6;
      color: var(--text);
    }

    .sub-btn.active {
      background: var(--accent);
      color: #ffffff !important;
      border-color: transparent;
      font-weight: bold;
    }

    .sidebar-footer {
      margin-top: 24px;
      padding: 16px 14px;
      border-radius: 12px;
      background: #faf9f6;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .main { 
      flex: 1;
      min-width: 0;
      padding: 28px; 
    }

    /* 控制面板：纯白扁平 */
    .control-panel {
      padding: 20px;
      display: grid;
      gap: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    /* 自定义介绍：扁平纯色块 */
    .custom-intro {
      background: #fff3f0;
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
    }
    .custom-intro p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #8c432b;
      font-weight: bold;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search {
      flex: 1;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .search:focus { 
      border-color: var(--accent); 
    }

    .sort-btn {
      padding: 10px 16px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14px;
    }
    .sort-btn:hover {
      background: #faf9f6;
      border-color: var(--muted);
    }
    .sort-btn.active {
      background: var(--text);
      color: #ffffff;
      border-color: transparent;
      font-weight: bold;
    }

    .content-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin: 26px 0 14px;
    }
    .content-head h3 { margin: 0; font-size: 22px; }
    .content-head span { color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* 💡 重构为 <a> 标签：整张卡片可点击跳转，去除默认下划线 */
    .card {
      text-decoration: none;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex; 
      align-items: flex-start; /* 💡 严格顶部对齐，永不居中 */
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    /* 悬停改为高级扁平化平滑上移，拒绝全屏乱抖 */
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px rgba(40, 30, 20, 0.08);
    }

    .cover {
      width: 120px;
      aspect-ratio: 2 / 3;
      margin: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #faf9f6;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 18px 20px 18px 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* 💡 内部元素严格靠顶排列 */
      align-items: flex-start;
      gap: 10px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      color: var(--text);
    }
    .card:hover .title {
      color: var(--accent);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 6px;
      background: #faf9f6;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .rating {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: 700;
    }
    .stars {
      color: var(--accent);
      font-size: 14px;
    }

    /* ---------------- 特效样式控制台 ---------------- */
    /* 默认安静、自由换行的点评文字 */
    .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      display: block;
      color: var(--muted);
      white-space: pre-wrap; /* 💡【核心修正】完美支持 \n 或回车自由换行 */
      font-weight: normal;
    }

    @keyframes rainbow {
      0% { color: #ff7979; }
      25% { color: #badc58; }
      50% { color: #7ed6df; }
      75% { color: #e056fd; }
      100% { color: #ff7979; }
    }

    @keyframes textShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-0.6px, 0.4px); }
      40% { transform: translate(-0.4px, -0.6px); }
      60% { transform: translate(0.6px, 0.4px); }
      80% { transform: translate(-0.4px, 0.6px); }
      100% { transform: translate(0, 0); }
    }

    /* 只有特定打上标签的才会彩色抖动 */
    .desc.rainbow-shake {
      font-weight: bold;
      animation: rainbow 3s linear infinite, textShake 0.15s linear infinite;
    }
    .desc.rainbow-only {
      font-weight: bold;
      animation: rainbow 3s linear infinite;
    }
    .desc.shake-only {
      color: #ff4757;
      animation: textShake 0.15s linear infinite;
    }
    /* ----------------------------------------------- */

    .footer-note { margin: 20px 0 8px; color: var(--muted); font-size: 13px; }
    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
      background: #ffffff;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    /* ---------------- 🗂️ 核心移动端/竖屏抽屉式重构 ---------------- */
    @media (max-width: 768px) {
      /* 竖屏情况下，侧边栏转为悬浮侧面抽屉，绝不跑到顶部 */
      .sidebar { 
        position: fixed; 
        top: 0; 
        left: 0; 
        bottom: 0; 
        height: 100vh;
        width: 280px; 
        border-right: 1px solid var(--line);
        box-shadow: 4px 0 30px rgba(0,0,0,0.1);
        transform: translateX(0); /* 展开状态 */
      }
      
      /* 竖屏收起状态：往左侧屏幕外完美滑出隐藏 */
      .app.sidebar-collapsed .sidebar { 
        width: 280px; /* 保持宽度以便滑出动画平滑 */
        transform: translateX(-100%); 
      }

      .main { padding: 16px; }
      .card { flex-direction: column; align-items: stretch; }
      .cover { width: calc(100% - 32px); margin: 16px 16px 0 16px; }
      .card-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-wrapper">
        <div class="brand">
          <h1>漫画收藏阁</h1>
          <p>纯色扁平改版。已修复竖屏布局，卡片支持点击跳转，支持文本自由换行。</p>
        </div>

        <div class="section-title">漫画分类</div>
        <div id="subCategoryNav" class="nav-group"></div>

        <div class="sidebar-footer">
          静态漫画展示站。<br />
          竖屏下点击“展开/收起”即可从左侧唤出菜单。
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="panel control-panel">
        <div class="custom-intro">
          <p>✨ 欢迎来到我的私人漫画收纳所！可在 index.html 中随时自定义此段文字。 ✨</p>
        </div>

        <div class="control-row">
          <button id="toggleSidebar" class="sort-btn">📂 收起侧边栏</button>
          <input id="searchInput" class="search" type="text" placeholder="搜索漫画名称、标签或简介..." />
        </div>
        <div class="control-row">
          <button class="sort-btn active" data-sort="rating-desc">评分从高到低</button>
          <button class="sort-btn" data-sort="rating-asc">评分从低到高</button>
          <button class="sort-btn" data-sort="title-asc">名称 A-Z</button>
        </div>
      </section>

      <div class="content-head">
        <div>
          <h3 id="listTitle">全部漫画</h3>
          <span id="listMeta">按评分排序</span>
        </div>
        <div><span id="resultCount">0</span> 项结果</div>
      </div>

      <section id="cardGrid" class="grid"></section>
      <div id="emptyState" class="empty" style="display:none;">没有找到符合过滤条件的漫画。</div>

      <div class="footer-note">建议部署到 GitHub Pages 时保留为单页入口：<code>index.html</code>。</div>
    </main>
  </div>

  <script>
    // 💡 增加了 url 跳转属性，且 desc 中可以使用 \n 自由换行！
    const data = [
      { 
        title: "电锯人", 
        sub: "热血", 
        rating: 4, 
        cover: "", 
        desc: "节奏怪异且极猛！\n分镜具有强烈的电影质感与疯狂张力。", 
        effect: "rainbow-shake",
        url: "https://manga.bilibili.com/" // 💡 点击后跳转的网站
      },
      { 
        title: "海贼王", 
        sub: "冒险", 
        rating: 5, 
        cover: "", 
        desc: "连载数十载的史诗巨作。\n拥有极其庞大的世界观和令人动容的伏笔。", 
        effect: "rainbow-only",
        url: "#" 
      },
      { 
        title: "灌篮高手", 
        sub: "运动", 
        rating: 5, 
        cover: "", 
        desc: "属于青春与汗水的绝对经典！\n全国大赛阶段的无声分镜堪称漫画史巅峰。", 
        effect: "", // 💡 普通静止文字
        url: "#"
      },
      { 
        title: "间谍过家家", 
        sub: "喜剧", 
        rating: 4, 
        cover: "", 
        desc: "顶尖特工、杀手组织与读心术女儿。\n构成的爆笑伪装家庭日常。", 
        effect: "shake-only",
        url: "#"
      }
    ];

    const state = {
      sub: "全部",
      sort: "rating-desc",
      search: ""
    };

    const subs = ["全部", ...new Set(data.map(i => i.sub))];

    const subCategoryNav = document.getElementById("subCategoryNav");
    const cardGrid = document.getElementById("cardGrid");
    const emptyState = document.getElementById("emptyState");
    const listTitle = document.getElementById("listTitle");
    const listMeta = document.getElementById("listMeta");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const toggleSidebarBtn = document.getElementById("toggleSidebar");
    const appContainer = document.querySelector(".app");

    function starText(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function renderSubNav() {
      subCategoryNav.innerHTML = subs.map(sub => `
        <button class="sub-btn ${state.sub === sub ? 'active' : ''}" data-sub="${sub}">${sub}</button>
      `).join("");
    }

    function applyFilters() {
      let list = [...data];
      if (state.sub !== "全部") list = list.filter(i => i.sub === state.sub);

      const q = state.search.trim().toLowerCase();
      if (q) {
        list = list.filter(i => [i.title, i.sub, i.desc].join(" ").toLowerCase().includes(q));
      }

      if (state.sort === "rating-desc") list.sort((a, b) => b.rating - a.rating);
      if (state.sort === "rating-asc") list.sort((a, b) => a.rating - b.rating);
      if (state.sort === "title-asc") list.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hans-CN'));

      return list;
    }

    function updateHeader(count) {
      resultCount.textContent = count;
      listTitle.textContent = state.sub === "全部" ? "全部漫画" : `${state.sub} 漫画`;
      listMeta.textContent = state.search ? `关键词：${state.search}` : `按 ${document.querySelector('.sort-btn.active')?.textContent || '评分从高到低'} 排序`;
    }

    function renderCards() {
      const list = applyFilters();
      updateHeader(list.length);
      
      // 💡 核心改动：用 <a> 标签替代原来的 article，注入 href 和 target="_blank"
      cardGrid.innerHTML = list.map(item => `
        <a href="${item.url || '#'}" target="_blank" class="card">
          <div class="cover">
            ${item.cover ? `<img src="${item.cover}" alt="${item.title} 封面">` : `<div class="cover-placeholder" style="text-align:center;line-height:180px;font-size:13px;color:#b0a8a0;">2:3 封面</div>`}
          </div>
          <div class="card-body">
            <h4 class="title">${item.title}</h4>
            <div class="meta-row">
              <span class="tag">${item.sub}</span>
              <span class="rating"><span class="stars">${starText(item.rating)}</span></span>
            </div>
            <p class="desc ${item.effect || ''}">${item.desc}</p>
          </div>
        </a>
      `).join("");

      emptyState.style.display = list.length ? "none" : "block";
    }

    // 侧边栏折叠/展开控制
    toggleSidebarBtn.addEventListener("click", () => {
      appContainer.classList.toggle("sidebar-collapsed");
      const isCollapsed = appContainer.classList.contains("sidebar-collapsed");
      toggleSidebarBtn.innerHTML = isCollapsed ? "📂 展开侧边栏" : "📂 收起侧边栏";
    });

    subCategoryNav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-sub]");
      if (!btn) return;
      state.sub = btn.dataset.sub;
      renderSubNav();
      renderCards();
      // 手机端选完分类后自动收起菜单，提升体验
      if (window.innerWidth <= 768) {
        appContainer.classList.add("sidebar-collapsed");
        toggleSidebarBtn.innerHTML = "📂 展开侧边栏";
      }
    });

    document.querySelectorAll(".sort-btn[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn[data-sort]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.sort = btn.dataset.sort;
        renderCards();
      });
    });

    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      renderCards();
    });

    // 💡【智能优化】如果是手机竖屏状态打开，初始化时默认把侧边栏收起来
    if (window.innerWidth <= 768) {
      appContainer.classList.add("sidebar-collapsed");
      toggleSidebarBtn.innerHTML = "📂 展开侧边栏";
    }

    // 初始化
    renderSubNav();
    renderCards();
  </script>
</body>
</html>
